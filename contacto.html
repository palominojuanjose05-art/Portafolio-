
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacta a Juan Jose Palomino Aroca, diseñador gráfico.">
  <title>Contacto | Juan Jose Palomino</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">

  <header class="site-header">
    <nav class="navbar container" aria-label="Navegación principal">
      <a class="nav-logo" href="index.html">JP.</a>

      <button class="menu-toggle" aria-label="Abrir menú"
        aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="portafolio.html">Portafolio</a></li>
        <li><a class="active" href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="split-page container">
      <div class="page-content">
        <span class="decorative-line"></span>
        <h1 class="page-title">Contacto</h1>

        <div class="contact-list">
          <div class="contact-item">
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48">
                <circle cx="24" cy="13" r="8"></circle>
                <path d="M8 41c0-10 6-16 16-16s16 6 16 16"></path>
              </svg>
            </span>
            <div>
              <h2>NOMBRE</h2>
              <p>Juan Jose Palomino Aroca</p>
            </div>
          </div>

          <a class="contact-item contact-anchor"
             href="https://wa.me/573009838453" target="_blank"
             rel="noopener noreferrer">
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48">
                <path d="M24 5a19 19 0 0 0-16 29L5 43l10-3A19 19 0 1 0 24 5Z"></path>
                <path d="M17 14c-2 1-3 4-2 7 2 6 7 11 13 13 3 1 6-1 7-4l-7-4-3 3c-3-1-5-3-6-6l2-3-4-6Z"></path>
              </svg>
            </span>
            <div>
              <h2>TELÉFONO</h2>
              <p>+57 300 9838453</p>
            </div>
          </a>

          <a class="contact-item contact-anchor"
             href="https://www.instagram.com/isopalomino/"
             target="_blank" rel="noopener noreferrer">
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48">
                <rect x="5" y="5" width="38" height="38" rx="10"></rect>
                <circle cx="24" cy="24" r="9"></circle>
                <circle class="icon-dot" cx="35" cy="13" r="2"></circle>
              </svg>
            </span>
            <div>
              <h2>INSTAGRAM</h2>
              <p>Isopalomino</p>
            </div>
          </a>
        </div>
      </div>

      <div class="plant-image" role="img"
        aria-label="Suculenta verde en una maceta de color claro"></div>
    </section>

    <section class="message-section container">
      <h2>Hablemos de tu proyecto.</h2>
      <p>Cuéntame tu idea y nos pondremos en contacto.</p>

      <form id="contact-form" class="contact-form">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name"
          placeholder="Tu nombre" required>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email"
          placeholder="tucorreo@ejemplo.com" required>

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="5"
          placeholder="Cuéntame sobre tu proyecto..." required></textarea>

        <button type="submit" class="outline-button">Enviar mensaje</button>
        <p id="form-status" class="form-status" role="status"
          aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer container">
    <p>© <span class="current-year">2026</span> Juan Jose Palomino Aroca</p>
    <p>Diseño con intención.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
